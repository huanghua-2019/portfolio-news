<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>持仓监控 · 新闻回看</title>
  <meta name="description" content="个人持仓公司新闻监控看板：自动抓取贵州茅台 / 腾讯控股 / 拼多多 / 泡泡玛特等持仓相关新闻，支持按公司、板块、分类、时间筛选与预警、已读管理。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css?v=9" />
</head>
<body>
  <div class="layout">
    <!-- ===== 左侧栏 ===== -->
    <aside class="sidebar">
      <div class="brand">📊 持仓监控 <span class="sub">· 新闻回看</span></div>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-view="home">🏠 首页</button>
        <button class="tab" data-view="news">📰 新闻</button>
        <button class="tab" data-view="dash">📊 总览</button>
        <button class="tab" data-view="alert">🔔 预警</button>
        <button class="tab" data-view="cal">📅 日历</button>
        <button class="tab" data-view="stat">💰 财务</button>
      </nav>
      <div class="sidebar-foot">
        <span id="countdown" class="countdown" title="距下次预计云端更新">--</span>
        <button id="refreshBtn" class="btn-refresh" title="刷新本地数据；同时打开云端爬虫触发页（点 Run workflow 可抓最新新闻）">↻ 刷新</button>
      </div>
    </aside>

    <!-- ===== 右侧内容 ===== -->
    <main class="content">

  <!-- ===== 首页仪表盘 ===== -->
  <section id="view-home" class="view active">
    <div id="home-wrap"></div>
  </section>

  <!-- ===== 新闻视图 ===== -->
  <section id="view-news" class="view">
    <div class="toolbar">
      <input id="q-input" class="search" type="text" placeholder="搜索标题或内容…" />
      <div class="toolbar-row">
        <div class="chips" id="time-chips">
          <span class="chip-label">时间</span>
          <span class="chip" data-time="1d">今天</span>
          <span class="chip" data-time="3d">近3天</span>
          <span class="chip active" data-time="7d">近7天</span>
          <span class="chip" data-time="all">全部</span>
        </div>
        <label class="toggle"><input id="hideRead" type="checkbox" /> 隐藏已读</label>
      </div>
      <div class="chips" id="company-chips"><span class="chip-label">公司</span></div>
      <div class="chips" id="board-chips"><span class="chip-label">板块</span></div>
      <div class="chips" id="category-chips"><span class="chip-label">分类</span></div>
    </div>
    <div class="statbar" id="statbar"></div>
    <div id="timeline" class="timeline"></div>
  </section>

  <!-- ===== 总览视图 ===== -->
  <section id="view-dash" class="view">
    <div id="dash-grid" class="dash-grid"></div>
  </section>

  <!-- ===== 预警视图 ===== -->
  <section id="view-alert" class="view">
    <div class="alert-head">
      <span>命中以下关键词的新闻会在此高亮：</span>
      <span id="alert-legend" class="alert-legend"></span>
    </div>
    <div id="alert-list" class="timeline"></div>
  </section>

  <!-- ===== 日历视图 ===== -->
  <section id="view-cal" class="view">
    <div id="cal-wrap"></div>
  </section>

  <!-- ===== 统计视图 ===== -->
  <section id="view-stat" class="view">
    <div id="stat-wrap"></div>
  </section>

  <footer class="footer">
    <p>数据由 GitHub Actions 定时爬虫在云端抓取（每 <span id="cfgInterval">30</span> 分钟），抓完自动提交到仓库，本页直接读取。</p>
    <p>持仓 / 板块 / 财报月在 <code>holdings.json</code> 配置；爬虫在 <code>crawler/crawl.mjs</code>；预警词在 <code>app.js</code> 顶部 <code>ALERT</code> 配置。</p>
  </footer>
    </main>
  </div>

  <script src="app.js?v=9"></script>
</body>
</html>
