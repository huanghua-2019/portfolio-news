name: 持仓新闻爬虫

on:
  schedule:
    # 错峰调度（UTC）：每小时第 7、37 分触发，对应北京时间 15:07 / 15:37。
    # 原因：原 */30 在 :00/:30 整半点触发，恰是 GitHub 调度最拥堵的分钟，
    #       被平台节流到 3-10 小时才跑一次，导致"自动更新停了"。
    #       改 7/37 错开拥堵点后，调度基本准时（仍有 0-15 分钟正常延迟）。
    # 频率不变：每天 48 次 × 约 1 分钟 ≈ 48 分钟/月，远低于 2000 分钟免费上限。
    - cron: "7,37 * * * *"
  workflow_dispatch: {}      # 允许在 Actions 页面手动点一次

permissions:
  contents: write        # 允许 workflow 把 data/news.json 提交回仓库

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 运行爬虫
        run: node crawler/crawl.mjs

      - name: 提交 data/news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 更新持仓新闻 $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
